name: release

# A release here was an annotated tag plus prose. Two consequences this fixes:
#
#   1. The v0.2.0 draft release pointed at a tag that existed neither locally
#      nor on origin. Publishing it would have minted the tag from whatever
#      main happened to be at that moment -- a release object whose referent is
#      decided after the fact. `--verify-tag` makes that class impossible.
#   2. "The release" and "what a user installs" were different bytes by
#      construction: the README clones main, and install-skill.sh clones the
#      local checkout at HEAD. The artifact below is built by RUNNING the
#      installer at the tag, so it is not a second definition of an install --
#      it is the output of the only one.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "tag to release, e.g. v0.2.0"
        required: true

permissions:
  contents: write

env:
  DOLT_VERSION: "2.3.0"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the tag
        id: t
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::not a release tag: $tag"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.t.outputs.tag }}
          fetch-depth: 0

      - name: The tag exists, and points at something reviewed
        run: |
          set -euo pipefail
          tag="${{ steps.t.outputs.tag }}"
          git rev-parse -q --verify "refs/tags/$tag^{commit}" >/dev/null \
            || { echo "::error::no such tag: $tag"; exit 1; }
          # A lightweight tag carries no tagger and no date, which is thin
          # provenance for a governance artifact.
          [ "$(git cat-file -t "$tag")" = "tag" ] \
            || echo "::warning::$tag is lightweight; prefer git tag -a"
          git fetch -q origin main
          git merge-base --is-ancestor "$tag" origin/main \
            || { echo "::error::$tag is not an ancestor of origin/main -- releasing unreviewed history"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Version strings agree with the tag
        run: python3 tools/check-version.py "${{ steps.t.outputs.tag }}"

      - name: Adapter dependencies
        run: |
          set -euo pipefail
          url="https://github.com/dolthub/dolt/releases/download/v${DOLT_VERSION}/dolt-linux-amd64.tar.gz"
          curl -fsSL --retry 3 "$url" -o /tmp/dolt.tgz
          tar -xzf /tmp/dolt.tgz -C /tmp
          sudo install -m 0755 "$(find /tmp -type f -name dolt -perm -u+x | head -1)" /usr/local/bin/dolt
          dolt version

      - run: ./tools/bootstrap-decisions.sh

      - name: Conformance at the tag
        run: |
          ./tools/run-conformance.sh --hermetic
          python3 engine/manifest.py --validate

      - name: Build the artifact by RUNNING the installer
        id: pack
        run: |
          set -euo pipefail
          tag="${{ steps.t.outputs.tag }}"
          work="$(mktemp -d)"; mkdir -p "$work/target"; git -C "$work/target" init -q
          # Not a reimplementation of the prune. The installer IS the definition
          # of an install; whatever it produces at this tag is what ships.
          bash tools/install-skill.sh "$work/target" ".agents/skills" no </dev/null
          src="$work/target/.agents/skills/repo-governor"
          # A release asset is not a working copy. The install path stays a git
          # clone -- INSTALLED.md documents updating with git pull -- so this
          # tarball is provenance for auditors and air-gapped use, never the
          # advertised way to install.
          rm -rf "$src/.git"
          tar --sort=name --owner=0 --group=0 --numeric-owner \
              --mtime="@$(git log -1 --format=%ct "$tag")" \
              -czf "repo-governor-${tag}.tar.gz" -C "$(dirname "$src")" repo-governor
          sha256sum "repo-governor-${tag}.tar.gz" | tee "repo-governor-${tag}.tar.gz.sha256"

      - name: The artifact is what it claims to be
        run: |
          set -euo pipefail
          t="repo-governor-${{ steps.t.outputs.tag }}.tar.gz"
          tar -tzf "$t" | grep -qx 'repo-governor/SKILL.md' \
            || { echo "::error::no SKILL.md in the artifact"; exit 1; }
          # The prune is the whole reason install-skill.sh exists. A pruned path
          # surviving into a published artifact would ship this repository's own
          # manifest to everyone who downloads it (ADR-027).
          if tar -tzf "$t" | grep -Eq '^repo-governor/(AGENTS\.md|CLAUDE\.md|\.claude/|\.repo-governor)'; then
            echo "::error::a pruned path survived into the release artifact"; exit 1
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.t.outputs.tag }}"
          notes="docs/releases/${tag}.md"
          assets=("repo-governor-${tag}.tar.gz" "repo-governor-${tag}.tar.gz.sha256")
          if gh release view "$tag" >/dev/null 2>&1; then
            # A hand-written draft may already exist. Adopt it rather than
            # failing -- gh release create refuses when the name is taken, even
            # by a draft, so a naive workflow would break on the first release.
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" --draft=false --verify-tag
          elif [ -f "$notes" ]; then
            gh release create "$tag" --verify-tag --title "$tag" --notes-file "$notes" "${assets[@]}"
          else
            gh release create "$tag" --verify-tag --title "$tag" --generate-notes "${assets[@]}"
          fi
