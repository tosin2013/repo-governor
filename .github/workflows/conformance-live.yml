name: conformance (live)

# conformance/hooks.py is the one suite that is not hermetic: line 163 runs
# engine/completion.py against the LIVE board, so its verdict depends on an
# issue's current milestone and assignee -- facts that change with no commit.
#
# It is deliberately NOT a `continue-on-error` job inside conformance.yml. A
# continue-on-error job reports SUCCESS to the checks API; its failure shows
# only as a small annotation inside a green run. That is a check whose failure
# is indistinguishable from a pass, which is the defect this repository keeps
# writing checks to prevent -- adding a third instance of it, in the workflow
# whose purpose is to stop them, would be self-defeating.
#
# So: a separate workflow, with no `pull_request` trigger. Red stays honestly
# red, and a board edit never lands a red X on somebody's pull request.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  hooks:
    name: hooks (live board)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # hooks.py runs tools/install-skill.sh into temp repos several times,
          # and that clones this checkout.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: hooks conformance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/run-conformance.sh --live
      - name: Say which half broke
        if: failure()
        run: |
          {
            echo "### hooks.py is red"
            echo
            echo "Two very different causes, and the distinction matters:"
            echo
            echo "- **Board state.** The capture check runs the engine against a live"
            echo "  issue. If that issue's milestone or assignee moved, this is not a"
            echo "  code defect and no commit caused it."
            echo "- **The installer half.** Everything below the capture block is"
            echo "  hermetic -- it drives tools/install-skill.sh into temp repositories"
            echo "  and pins the host templates. A failure there IS a code defect."
            echo
            echo "Open the step log and read which check failed before concluding either."
          } >> "$GITHUB_STEP_SUMMARY"
